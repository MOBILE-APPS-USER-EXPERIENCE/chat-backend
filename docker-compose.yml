services:
  backend:
    image: ghcr.io/mobille-apps-user-experience/chat-backend:latest
    env_file:
      - ./.env
    volumes:
      - ./chat_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.chat-server.rule=Host(`${SERVICE_DOMAIN}`)
      - traefik.http.routers.chat-server.entrypoints=websecure
      - traefik.http.routers.chat-server.tls.certresolver=letsencrypt
      - traefik.http.services.chat-server.loadbalancer.server.port=${PORT}
    networks:
      - traefik

networks:
  traefik:
    external: true
